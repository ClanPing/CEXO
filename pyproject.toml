[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cexo"
version = "0.1.0"
description = "Construction-site layout optimisation and quality-diversity generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "matplotlib",
  "torch",
]

[tool.setuptools]
py-modules = ["main", "run_mapelites", "run_nsga2", "analysis"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "examples*"]
